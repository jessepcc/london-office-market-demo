[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "london-market-agent"
version = "0.1.0"
description = "Local London office market evidence and research PoC"
requires-python = ">=3.12"
dependencies = [
  "streamlit==1.50.0",
  "plotly==6.3.1",
  "httpx==0.28.1",
  "pydantic==2.12.3",
  "beautifulsoup4==4.14.2",
  "pypdf==6.12.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
london-market = "london_market.__main__:main"

[tool.setuptools.packages.find]
include = ["london_market*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
london_market = ["runtime_skills/*/SKILL.md"]
